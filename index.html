<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Operations OS</title>
    <link rel="stylesheet" href="css/04_dense_ops.css">
  </head>
  <body>
    <aside class="sidebar" aria-label="Main navigation"></aside>
<script src="js/components/app-shell.js"></script>
    <main class="main dashboard-main">
      <template id="appHeaderActions">
        <div class="manager-area">
          <label for="managerSelect">Manager on Duty</label>
          <select id="managerSelect">
            <option>Jordan Lee</option>
            <option>Alex Rivera</option>
            <option>Mia Torres</option>
          </select>
        </div>
      </template>
      <div id="appHeader"></div>
      <section aria-label="Reporting period"><div class="section-header"><h2>Performance</h2><span id="dashboardRange" class="recipe-muted"></span></div><div id="dashboardKPIs" class="dashboard-kpis"></div></section>
      <div class="section-header"><h2>Live Operations</h2><span id="liveDate" class="recipe-muted"></span></div>
      <section class="dashboard-attention"><div class="section-header"><h2>Needs Attention <span id="attentionCount"></span></h2><button class="secondary-button" id="attentionViewAll">Show All</button></div><div id="attentionList" class="attention-list"></div></section>
      <section><div class="section-header"><h2>Today's Shifts</h2><a href="history.html">Shift history →</a></div><div class="shift-grid">
        <article class="card shift-dashboard-card" id="openingShiftCard" data-total="10"></article>
        <article class="card shift-dashboard-card" id="midShiftCard" data-total="26"></article>
        <article class="card shift-dashboard-card" id="closingShiftCard" data-total="28"></article>
      </div></section>
      <div class="dashboard-panels"><section class="recipe-panel"><div class="section-header"><h2>Inventory Watch</h2><a href="inventory.html">Open inventory →</a></div><div id="inventoryWatch"></div></section><section class="recipe-panel"><div class="section-header"><h2>Team &amp; Tasks</h2><a href="tasks.html">Open tasks →</a></div><div id="teamWatch"></div></section></div>
      <section class="recipe-panel"><div class="section-header"><h2>Quick Actions</h2><span id="reportStatus" class="recipe-muted"></span></div><div class="dashboard-actions">
        <a class="secondary-button" href="sales.html">Record Sales</a><a class="secondary-button" href="receiving.html">Receive Stock</a><a class="secondary-button" href="waste.html">Log Waste</a><a class="secondary-button" href="production.html">Record Production</a><a class="secondary-button" href="inventory-count.html">Count Inventory</a><a class="secondary-button" href="daily-report.html">Daily Report</a>
      </div></section><div class="dashboard-footer"><button class="secondary-button" id="sampleDataButton">Load Sample Data</button></div>
    </main>
    <script src="js/issues.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/shift-service.js"></script>
    <script src="js/handover-service.js"></script>
    <script src="js/inventory_js/inventory-service.js"></script>
    <script src="js/recipe-service.js"></script>
    <script src="js/menu-service.js"></script>
    <script src="js/sales-service.js"></script>
    <script src="js/inventory_js/theoretical-usage-service.js"></script>
    <script src="js/settings-service.js"></script>
    <script src="js/analytics-context.js"></script>
    <script src="js/activity-service.js"></script>
    <script src="js/inventory_js/variance-service.js"></script>
    <script src="js/food-cost-service.js"></script>
    <script src="js/business-performance-service.js"></script>
    <script src="js/inventory_js/purchasing-service.js"></script>
    <script src="js/equipment-service.js"></script>
    <script src="js/team-service.js"></script>
    <script src="js/sop-service.js"></script>
    <script src="js/daily-report-service.js"></script>
    <script src="js/components/ui-feedback.js"></script>
    <script src="js/components/app-header.js"></script>
    <script src="js/sample-data.js"></script>
    <script>
      AppHeader.init({
        section: "COMMAND CENTER",
        title: "Dashboard",
        description: "Live operating view for today and the selected reporting period.",
        showDateSelector: true
      });
    </script>
    <script src="js/components/recipe-ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
