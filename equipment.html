<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment | Restaurant OS</title><link rel="stylesheet" href="css/app.css"></head><body><main class="main recipe-main"><header class="topbar"><div><button class="back-button" onclick="location.href='index.html'">← Dashboard</button><p class="eyebrow">RESTAURANT</p><h1>Equipment</h1><p>Equipment registry integrated with Issues, Tasks and Maintenance.</p></div></header><section id="equipmentMetrics" class="inventory-metrics"></section><section class="management-grid"><form id="equipmentForm" class="recipe-panel form-grid"><h2 class="full-width">Add Equipment</h2><label>Name<input name="name" required></label><label>Category<select name="category"><option>COOKING</option><option>REFRIGERATION</option><option>HOLDING</option><option>PREP</option><option>FACILITY</option><option>OTHER</option></select></label><label>Location<input name="location"></label><label>Status<select name="status"><option>OPERATIONAL</option><option>ATTENTION</option><option>OUT_OF_SERVICE</option><option>MAINTENANCE</option><option>RETIRED</option></select></label><label>Manufacturer<input name="manufacturer"></label><label>Model<input name="model"></label><label class="full-width">Notes<textarea name="notes" rows="3"></textarea></label><button class="primary-button">Add Equipment</button></form><form id="maintenanceForm" class="recipe-panel form-grid"><h2 class="full-width">Maintenance</h2><label>Equipment<select id="maintenanceEquipment" name="equipmentId" required></select></label><label>Type<select name="type"><option>PREVENTIVE</option><option>REPAIR</option><option>INSPECTION</option><option>CLEANING</option><option>OTHER</option></select></label><label>Status<select name="status"><option>SCHEDULED</option><option>COMPLETED</option><option>CANCELLED</option></select></label><label>Scheduled<input name="scheduledDate" type="date"></label><label>Completed<input name="completedDate" type="date"></label><label>Cost<input name="cost" type="number" min="0" step="0.01"></label><label class="full-width">Notes<textarea name="notes" rows="3"></textarea></label><button class="primary-button">Save Maintenance</button></form></section><section class="recipe-panel"><h2>Equipment Register</h2><p class="muted-text">Click equipment to create a central Issue.</p><div id="equipmentList" class="inventory-table"></div></section></main><script src="js/issues.js"></script><script src="js/tasks.js"></script><script src="js/analytics-context.js"></script><script src="js/activity-service.js"></script><script src="js/equipment-service.js"></script><script src="js/components/ui-feedback.js"></script><script src="js/equipment.js"></script></body></html>
