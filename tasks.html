<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | Restaurant OS</title><link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar"><div class="brand"><h2>Restaurant OS</h2><p>Harbor Grill</p></div><nav>
    <p class="nav-section">COMMAND CENTER</p><button class="nav-item" onclick="window.location.href='index.html'">Dashboard</button><button class="nav-item">Today</button>
    <p class="nav-section">OPERATIONS</p><button class="nav-item" onclick="window.location.href='opening.html'">Shifts</button><button class="nav-item active" onclick="window.location.href='tasks.html'">Tasks</button><button class="nav-item" onclick="window.location.href='issues.html'">Issues</button><button class="nav-item">Incidents</button>
    <p class="nav-section">INVENTORY</p><button class="nav-item">Inventory</button><button class="nav-item">Receiving</button><button class="nav-item">Waste</button><button class="nav-item">Recipes</button>
    <p class="nav-section">PERFORMANCE</p><button class="nav-item">Daily Report</button><button class="nav-item">Reports</button>
  </nav></aside>
  <main class="main">
    <header class="topbar issue-page-header"><div><h1>Tasks</h1><p>Track operational follow-up and ownership.</p></div><button class="primary-button" id="createTaskButton">+ Create Task</button></header>
    <section class="issue-summary-grid" id="taskSummary"></section>
    <section class="issue-toolbar task-toolbar">
      <label>Search<input id="taskSearch" type="search" placeholder="Search tasks"></label>
      <label>Status<select id="taskStatusFilter"><option value="">All statuses</option><option>PENDING</option><option>IN_PROGRESS</option><option>BLOCKED</option><option>COMPLETED</option><option>CANCELLED</option></select></label>
      <label>Priority<select id="taskPriorityFilter"><option value="">All priorities</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label>
      <label>Category<select id="taskCategoryFilter"><option value="">All categories</option><option>OPERATIONS</option><option>EQUIPMENT</option><option>INVENTORY</option><option>STAFFING</option><option>GUEST</option><option>FACILITY</option><option>VENDOR</option><option>MANAGEMENT</option><option>OTHER</option></select></label>
      <label>Assigned To<select id="taskAssigneeFilter"><option value="">All managers</option><option>Jordan Lee</option><option>Alex Rivera</option><option>Mia Torres</option></select></label>
      <label>Due Date<input id="taskDueDateFilter" type="date"></label>
    </section>
    <section><div class="section-header"><h2>Task Register</h2><span id="taskResultCount" class="muted-text"></span></div><div id="taskList" class="issue-list"></div></section>
  </main>
  <script src="js/tasks.js"></script><script src="js/components/task-form.js"></script><script src="js/tasks-page.js"></script>
</body>
</html>
