<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team | Restaurant OS</title><link rel="stylesheet" href="css/app.css"></head><body><main class="main recipe-main"><header class="topbar"><div><button class="back-button" onclick="location.href='index.html'">← Dashboard</button><p class="eyebrow">TEAM OPERATIONS</p><h1>Team</h1><p>Operational team capability and training matrix.</p></div></header><section id="teamMetrics" class="inventory-metrics"></section><section class="recipe-panel"><form id="teamForm" class="form-grid"><h2 class="full-width">Add Team Member</h2><label>Name<input name="name" required></label><label>Role<input name="role" placeholder="Manager"></label><label>Status<select name="status"><option>ACTIVE</option><option>INACTIVE</option></select></label><label>Positions<input name="positions" placeholder="Manager, Counter, Production"></label><label>Phone<input name="phone"></label><label>Email<input name="email"></label><label class="full-width">Notes<textarea name="notes" rows="3"></textarea></label><button class="primary-button">Add Member</button></form></section><section class="recipe-panel"><h2>Team Register</h2><div id="teamList" class="inventory-table"></div></section><section class="recipe-panel"><h2>Skill Matrix</h2><p class="muted-text">Click a cell to cycle training status.</p><div id="skillMatrix"></div></section></main><script src="js/settings-service.js"></script><script src="js/analytics-context.js"></script><script src="js/activity-service.js"></script><script src="js/team-service.js"></script><script src="js/components/ui-feedback.js"></script><script src="js/team.js"></script></body></html>
