<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closing Shift | Restaurant OS</title>
    <link rel="stylesheet" href="css/04_dense_ops.css">
  </head>
  <body>
    <aside class="sidebar" aria-label="Main navigation"></aside>
<script src="js/components/app-shell.js"></script>
    <main class="main">
      <header class="topbar">
        <div>
          <button class="back-button" onclick="window.location.href='index.html'">← Dashboard</button>
          <h1>Closing Shift</h1>
          <p id="shiftInformation">Preparing shift...</p>
        </div>
        <span class="status shift-status" id="shiftStatus">In Progress</span>
      </header>
      <section class="shift-progress-card">
        <p class="eyebrow">SHIFT PROGRESS</p>
        <h2 id="progressText">0 / 0 tasks complete</h2>
        <div class="progress">
          <div class="progress-bar" id="openingProgressBar" style="width:0%"></div>
        </div>
        <strong id="progressPercentage">0%</strong>
      </section>
      <section id="liveCounts" class="live-counts"></section>
      <section id="shiftChecklist"></section>
      <section id="tomorrowPriorityWrap" class="priority" hidden>
        <div>
          <p class="eyebrow">NEXT-DAY PREPARATION</p>
          <h3>Tomorrow's Priority</h3>
          <textarea id="tomorrowPriority" rows="3" placeholder="What should tomorrow's team know first?"></textarea>
        </div>
      </section>
      <section class="shift-footer">
        <button class="secondary-button" id="createTaskButton">Create Task</button>
        <button class="primary-button" id="completeShiftButton">Complete Closing Shift</button>
      </section>
      <section id="closingSummary" class="closing-summary" hidden>
        <p class="eyebrow">CLOSING SUMMARY</p>
        <h2>Ready to complete</h2>
        <p id="summaryText"></p>
        <button class="primary-button" id="confirmClosing">Confirm Complete</button>
      </section>
    </main>
    <script src="js/issues.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/components/issue-form.js"></script>
    <script src="js/components/task-form.js"></script>
    <script src="js/shift-service.js"></script>
    <script src="js/closing.js"></script>
    <script src="js/shift-page.js"></script>
  </body>
</html>
