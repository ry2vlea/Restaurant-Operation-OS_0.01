<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inventory | Restaurant OS</title><link rel="stylesheet" href="css/app.css"></head><body><aside class="sidebar"><div class="brand"><h2>Restaurant OS</h2><p>Harbor Grill</p></div><nav><p class="nav-section">COMMAND CENTER</p><button class="nav-item" onclick="location.href='index.html'">Dashboard</button><button class="nav-item">Today</button><p class="nav-section">OPERATIONS</p><button class="nav-item" onclick="location.href='opening.html'">Shifts</button><button class="nav-item" onclick="location.href='tasks.html'">Tasks</button><button class="nav-item" onclick="location.href='issues.html'">Issues</button><button class="nav-item">Incidents</button><p class="nav-section">INVENTORY</p><button class="nav-item active">Inventory</button><button class="nav-item" onclick="location.href='receiving.html'">Receiving</button><button class="nav-item" onclick="location.href='waste.html'">Waste</button><button class="nav-item" onclick="location.href='recipes.html'">Recipes</button><button class="nav-item" onclick="location.href='menu.html'">Menu</button><p class="nav-section">PERFORMANCE</p><button class="nav-item" onclick="location.href='daily-report.html'">Daily Report</button><button class="nav-item">Reports</button></nav></aside><main class="main inventory-main"><header class="topbar issue-page-header"><div><p class="eyebrow">INVENTORY CONTROL</p><h1>Inventory</h1><p>Monitor stock position, exceptions and inventory activity.</p></div><div class="inventory-actions"><button class="secondary-button" id="startCountButton">Start Count</button><button class="secondary-button" id="receiveButton">Receive Delivery</button><button class="secondary-button" id="wasteButton">Record Waste</button><button class="primary-button" id="addItemButton">+ Add Item</button></div></header><section class="inventory-health" id="inventoryHealth"></section><section class="inventory-metrics" id="inventoryMetrics"></section><section class="inventory-attention"><div class="section-header"><div><p class="eyebrow">EXCEPTIONS</p><h2>Needs Attention</h2></div></div><div id="inventoryAttention" class="inventory-attention-list"></div></section><section class="inventory-toolbar"><label>Search<input id="inventorySearch" type="search" placeholder="Search items or SKU"></label><label>Category<select id="inventoryCategory"><option value="">All categories</option></select></label><label>Status<select id="inventoryStatus"><option value="">All statuses</option><option>OUT_OF_STOCK</option><option>CRITICAL</option><option>LOW</option><option>GOOD</option><option>OVERSTOCK</option></select></label><label>Location<select id="inventoryLocation"><option value="">All locations</option></select></label></section><section><div class="section-header"><h2>Item Register</h2><span id="inventoryResult" class="muted-text"></span></div><div id="inventoryTable" class="inventory-table"></div></section><section class="inventory-history"><div class="section-header"><div><p class="eyebrow">TRACEABILITY</p><h2>Recent Movements</h2></div><button class="secondary-button" id="movementButton">Record Movement</button></div><div id="movementList" class="movement-list"></div></section></main><script src="js/inventory-service.js"></script><script src="js/issues.js"></script><script src="js/tasks.js"></script><script src="js/components/issue-form.js"></script><script src="js/components/task-form.js"></script><script src="js/components/ui-feedback.js"></script><script src="js/inventory.js"></script></body></html>
