<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Business Performance | Restaurant OS</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/app-header.css">
  </head>
  <body>
    <main class="main recipe-main">
      <div id="appHeader"></div>
      <section id="performanceMetrics" class="inventory-metrics"></section>
      <section class="recipe-panel">
        <form id="performanceForm" class="form-grid">
          <label>
            Date
            <input id="performanceDate" name="date" type="date">
          </label>
          <label>
            Net Sales
            <input name="netSales" type="number" min="0" step="0.01">
          </label>
          <label>
            Transactions
            <input name="transactions" type="number" min="0">
          </label>
          <label>
            Labor Hours
            <input name="laborHours" type="number" min="0" step="0.01">
          </label>
          <label>
            Labor Dollars
            <input name="laborDollars" type="number" min="0" step="0.01">
          </label>
          <label class="full-width">
            Notes
            <textarea name="notes" rows="3"></textarea>
          </label>
          <button class="primary-button">Save Performance</button>
        </form>
      </section>
      <section class="recipe-panel">
        <div class="section-header">
          <h2>Performance History</h2>
        </div>
        <div id="performanceHistory" class="inventory-table"></div>
      </section>
    </main>
    <script src="js/inventory-service.js"></script>
    <script src="js/recipe-service.js"></script>
    <script src="js/menu-service.js"></script>
    <script src="js/theoretical-usage-service.js"></script>
    <script src="js/settings-service.js"></script>
    <script src="js/analytics-context.js"></script>
    <script src="js/activity-service.js"></script>
    <script src="js/variance-service.js"></script>
    <script src="js/food-cost-service.js"></script>
    <script src="js/business-performance-service.js"></script>
    <script src="js/components/ui-feedback.js"></script>
    <script src="js/components/app-header.js"></script>
    <script>
      AppHeader.init({
        section: "BUSINESS PERFORMANCE",
        title: "Business Performance",
        description: "Daily sales and labor input with derived operating metrics.",
        backHref: "index.html",
        backLabel: "Dashboard",
        showDateSelector: true
      });
    </script>
    <script src="js/business-performance.js"></script>
  </body>
</html>
