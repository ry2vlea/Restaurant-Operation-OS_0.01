<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings | Restaurant OS</title>
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <main class="main recipe-main">
      <header class="topbar">
        <div>
          <button class="back-button" onclick="location.href='index.html'">← Dashboard</button>
          <p class="eyebrow">SYSTEM</p>
          <h1>Settings</h1>
          <p>Restaurant profile, performance targets and backup/restore.</p>
        </div>
      </header>
      <section class="recipe-panel">
        <form id="settingsForm" class="form-grid">
          <h2 class="full-width">Restaurant Profile</h2>
          <label>
            Restaurant Name
            <input name="restaurantName">
          </label>
          <label>
            Location Name
            <input name="locationName">
          </label>
          <label>
            Address
            <input name="address">
          </label>
          <label>
            Phone
            <input name="phone">
          </label>
          <label class="full-width">
            Operating Hours
            <input name="operatingHours">
          </label>
          <h2 class="full-width">Performance Targets</h2>
          <label>
            Target Food Cost %
            <input name="foodCostPercent" type="number" min="0" step="0.1">
          </label>
          <label>
            Target Labor %
            <input name="laborPercent" type="number" min="0" step="0.1">
          </label>
          <label>
            Waste Alert Threshold
            <input name="wasteAlertThreshold" type="number" min="0" step="0.01">
          </label>
          <label>
            Variance Alert Threshold
            <input name="varianceAlertThreshold" type="number" min="0" step="0.01">
          </label>
          <button class="primary-button">Save Settings</button>
        </form>
      </section>
      <section class="management-grid">
        <section class="recipe-panel">
          <h2>Export System Backup</h2>
          <button class="secondary-button" id="exportBackup">Export Backup</button>
          <textarea id="backupOutput" rows="10" readonly></textarea>
        </section>
        <section class="recipe-panel">
          <h2>Restore Backup</h2>
          <textarea id="restoreInput" rows="10" placeholder="Paste Restaurant OS backup JSON"></textarea>
          <button class="danger-button" id="restoreBackup">Validate & Restore</button>
        </section>
      </section>
    </main>
    <script src="js/analytics-context.js"></script>
    <script src="js/activity-service.js"></script>
    <script src="js/settings-service.js"></script>
    <script src="js/components/ui-feedback.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
